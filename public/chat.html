<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat with us</title>
<style>
  :root { --brand:#0f766e; --bg:#f4f6f5; --me:#0f766e; --bot:#fff; --ink:#14201e; }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body { font:16px/1.45 system-ui,sans-serif; background:var(--bg); color:var(--ink); display:flex; flex-direction:column; }
  header { background:var(--brand); color:#fff; padding:14px 16px; font-weight:600; }
  header small { display:block; font-weight:400; opacity:.85; }
  #log { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:8px; }
  .msg { max-width:82%; padding:10px 14px; border-radius:16px; white-space:pre-wrap; word-wrap:break-word; }
  .bot { background:var(--bot); align-self:flex-start; border-bottom-left-radius:4px; box-shadow:0 1px 2px #0001; }
  .me { background:var(--me); color:#fff; align-self:flex-end; border-bottom-right-radius:4px; }
  form { display:flex; gap:8px; padding:12px; background:#fff; border-top:1px solid #e3e8e6; }
  input { flex:1; font:inherit; padding:12px 14px; border:1px solid #cfd8d5; border-radius:24px; outline:none; }
  input:focus { border-color:var(--brand); }
  button { font:inherit; border:0; background:var(--brand); color:#fff; padding:0 20px; border-radius:24px; cursor:pointer; }
  button:disabled { opacity:.5; }
</style>
</head>
<body>
<header><span id="agency">Ease Estate</span><small>Ask about our listings. Replies are instant.</small></header>
<div id="log" aria-live="polite"></div>
<form id="f"><input id="m" placeholder="e.g. 2 bedroom to rent in Yaba" autocomplete="off" maxlength="1000" required><button id="b">Send</button></form>
<script>
const log = document.getElementById('log'), f = document.getElementById('f'), m = document.getElementById('m'), b = document.getElementById('b');
let sid = null;
try { sid = localStorage.getItem('ee_session'); } catch {}
const add = (text, who) => { const d = document.createElement('div'); d.className = 'msg ' + who; d.textContent = text; log.appendChild(d); log.scrollTop = log.scrollHeight; };
fetch('/api/config').then(r => r.json()).then(c => { document.getElementById('agency').textContent = c.agency; document.title = 'Chat with ' + c.agency; }).catch(() => {});
add('Hi! 👋 I can help you find a property to buy or rent. What are you looking for?', 'bot');
f.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = m.value.trim(); if (!text) return;
  add(text, 'me'); m.value = ''; b.disabled = true;
  try {
    const r = await fetch('/api/chat', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ message: text, session_id: sid }) });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error);
    sid = d.session_id; try { localStorage.setItem('ee_session', sid); } catch {}
    add(d.reply, 'bot');
  } catch { add('Sorry, something went wrong. Please try again.', 'bot'); }
  b.disabled = false; m.focus();
});
</script>
</body>
</html>
