<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ease Estate · Dashboard</title>
<style>
  :root { --brand:#0f766e; --ink:#14201e; --mut:#5d6f6b; --line:#dfe6e4; }
  * { box-sizing:border-box; }
  body { font:15px/1.45 system-ui,sans-serif; margin:0; color:var(--ink); background:#f4f6f5; }
  header { background:var(--brand); color:#fff; padding:14px 20px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; }
  nav button { background:transparent; border:0; color:#fff; font:inherit; padding:6px 12px; cursor:pointer; opacity:.75; border-bottom:2px solid transparent; }
  nav button.on { opacity:1; border-color:#fff; }
  main { max-width:1000px; margin:0 auto; padding:20px; }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:12px; margin-bottom:20px; }
  .stat { background:#fff; border:1px solid var(--line); border-radius:10px; padding:12px 14px; }
  .stat b { font-size:1.6rem; display:block; } .stat span { color:var(--mut); font-size:.85rem; }
  .card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:10px; }
  .row { display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; align-items:center; }
  .mut { color:var(--mut); font-size:.88rem; } .tag { font-size:.75rem; padding:2px 8px; border-radius:99px; background:#e6efed; color:var(--brand); }
  select, input, textarea, button { font:inherit; }
  select, input, textarea { padding:8px 10px; border:1px solid #c9d4d1; border-radius:8px; width:100%; }
  button.pri { background:var(--brand); color:#fff; border:0; padding:9px 16px; border-radius:8px; cursor:pointer; }
  button.link { background:none; border:0; color:var(--brand); cursor:pointer; padding:0; }
  button.danger { color:#b42318; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:10px; }
  a { color:var(--brand); }
  .chat { background:#f4f6f5; border-radius:8px; padding:8px 12px; margin-top:10px; max-height:260px; overflow:auto; }
  .chat p { margin:4px 0; } .chat .u { color:var(--brand); font-weight:600; }
  #login { max-width:340px; margin:80px auto; background:#fff; padding:24px; border-radius:12px; border:1px solid var(--line); }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<div id="login" hidden>
  <h2 style="margin-top:0">Ease Estate</h2>
  <p class="mut">Enter your admin token (<code>ADMIN_TOKEN</code> in .env)</p>
  <input id="tok" type="password" placeholder="Admin token">
  <p><button class="pri" id="go">Open dashboard</button> <span id="err" class="mut"></span></p>
</div>
<div id="app" hidden>
  <header>
    <strong>Ease Estate</strong>
    <nav><button data-tab="leads" class="on">Leads</button><button data-tab="listings">Listings</button><button id="out">Sign out</button></nav>
  </header>
  <main>
    <section id="leads"><div class="stats" id="stats"></div>
      <div class="row" style="margin-bottom:12px"><span class="mut">Newest activity first</span>
        <select id="filter" style="width:auto"><option value="">All statuses</option><option>new</option><option>contacted</option><option>inspection</option><option>won</option><option>lost</option></select></div>
      <div id="leadlist"></div></section>
    <section id="listings" hidden>
      <form id="lf" class="card"><div class="grid">
        <input name="title" placeholder="Title (3 Bedroom Flat, Lekki)" required>
        <select name="type"><option value="rent">For rent (price per year)</option><option value="sale">For sale</option></select>
        <input name="price" type="number" min="1" placeholder="Price in ₦" required>
        <input name="location" placeholder="Area (Lekki, Lagos)" required>
        <input name="bedrooms" type="number" min="0" placeholder="Bedrooms">
        <input name="bathrooms" type="number" min="0" placeholder="Bathrooms"></div>
        <textarea name="description" rows="2" placeholder="Features the bot can mention: power, security, title docs..." style="margin:10px 0"></textarea>
        <button class="pri">Add listing</button></form>
      <div id="listinglist"></div></section>
  </main>
</div>
<script>
const $ = (s) => document.querySelector(s);
const naira = (n) => '₦' + Number(n).toLocaleString('en-NG');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
let token = ''; try { token = localStorage.getItem('ee_admin') || ''; } catch {}

async function call(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { 'content-type': 'application/json', authorization: 'Bearer ' + token } });
  if (r.status === 401) { signOut(); throw new Error('unauthorized'); }
  return r.json();
}
function signOut() { token = ''; try { localStorage.removeItem('ee_admin'); } catch {} $('#app').hidden = true; $('#login').hidden = false; }
async function start() {
  if (!token) return signOut();
  try { await call('/api/stats'); } catch { $('#err').textContent = 'Wrong token'; return; }
  $('#login').hidden = true; $('#app').hidden = false; loadLeads(); loadListings();
}
$('#go').onclick = () => { token = $('#tok').value.trim(); try { localStorage.setItem('ee_admin', token); } catch {} start(); };
$('#out').onclick = signOut;
document.querySelectorAll('nav [data-tab]').forEach((b) => b.onclick = () => {
  document.querySelectorAll('nav [data-tab]').forEach((x) => x.classList.toggle('on', x === b));
  $('#leads').hidden = b.dataset.tab !== 'leads'; $('#listings').hidden = b.dataset.tab !== 'listings';
});

async function loadLeads() {
  const [s, leads] = await Promise.all([call('/api/stats'), call('/api/leads' + ($('#filter').value ? '?status=' + $('#filter').value : ''))]);
  $('#stats').innerHTML = [['Total leads', s.total], ['With phone', s.with_phone], ['New', s.leads.new || 0], ['Inspections', s.leads.inspection || 0], ['Won', s.leads.won || 0], ['Live listings', s.listings]]
    .map(([k, v]) => `<div class="stat"><b>${v}</b><span>${k}</span></div>`).join('');
  $('#leadlist').innerHTML = leads.length ? leads.map((l) => `
    <div class="card" data-id="${l.id}">
      <div class="row"><strong>${esc(l.name || 'Unknown visitor')}</strong>
        <select class="st" style="width:auto">${['new','contacted','inspection','won','lost'].map((x) => `<option ${x === l.status ? 'selected' : ''}>${x}</option>`).join('')}</select></div>
      <div class="mut">${l.phone ? `<a href="https://wa.me/${esc(l.phone.replace(/\D/g, ''))}" target="_blank" rel="noopener">${esc(l.phone)}</a> · ` : ''}${esc(l.channel)} · ${esc(l.updated_at)}</div>
      <div style="margin:6px 0">${l.intent ? `<span class="tag">${esc(l.intent)}</span> ` : ''}${l.budget ? `Budget ${naira(l.budget)} · ` : ''}${esc(l.location || '')}${l.timeline ? ' · ' + esc(l.timeline) : ''}${l.listing_title ? '<br>Interested in: ' + esc(l.listing_title) : ''}</div>
      ${l.summary ? `<div class="mut">${esc(l.summary)}</div>` : ''}
      <button class="link tr">View conversation</button><div class="chat" hidden></div>
    </div>`).join('') : '<p class="mut">No leads yet. Share the chat link or connect WhatsApp.</p>';
}
$('#filter').onchange = loadLeads;
$('#leadlist').addEventListener('change', async (e) => {
  if (!e.target.classList.contains('st')) return;
  await call('/api/leads/' + e.target.closest('.card').dataset.id, { method: 'PATCH', body: JSON.stringify({ status: e.target.value }) }); loadLeads();
});
$('#leadlist').addEventListener('click', async (e) => {
  if (!e.target.classList.contains('tr')) return;
  const card = e.target.closest('.card'), box = card.querySelector('.chat');
  if (!box.hidden) return box.hidden = true;
  const msgs = await call(`/api/leads/${card.dataset.id}/messages`);
  box.innerHTML = msgs.map((m) => `<p><span class="u">${m.role === 'user' ? 'Prospect' : 'Bot'}:</span> ${esc(m.content)}</p>`).join(''); box.hidden = false;
});

async function loadListings() {
  const rows = await call('/api/listings');
  $('#listinglist').innerHTML = rows.map((l) => `
    <div class="card" data-id="${l.id}"><div class="row"><div><strong>${esc(l.title)}</strong> <span class="tag">${l.type}</span> ${l.status === 'taken' ? '<span class="tag">taken</span>' : ''}
      <div class="mut">${naira(l.price)}${l.type === 'rent' ? '/yr' : ''} · ${esc(l.location)} · ${l.bedrooms} bed · ${l.bathrooms} bath</div></div>
      <div><button class="link tg">${l.status === 'taken' ? 'Mark available' : 'Mark taken'}</button> · <button class="link danger rm">Delete</button></div></div></div>`).join('');
}
$('#lf').onsubmit = async (e) => {
  e.preventDefault();
  await call('/api/listings', { method: 'POST', body: JSON.stringify(Object.fromEntries(new FormData(e.target))) });
  e.target.reset(); loadListings();
};
$('#listinglist').addEventListener('click', async (e) => {
  const card = e.target.closest('.card'); if (!card) return;
  const id = card.dataset.id;
  if (e.target.classList.contains('rm') && confirm('Delete this listing?')) await call('/api/listings/' + id, { method: 'DELETE' });
  else if (e.target.classList.contains('tg')) await call('/api/listings/' + id, { method: 'PATCH', body: JSON.stringify({ status: e.target.textContent === 'Mark taken' ? 'taken' : 'available' }) });
  else return;
  loadListings();
});
start();
</script>
</body>
</html>
